<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>RecallFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --background:#f7f5ef;--foreground:#20242c;--surface:#efede6;--card:#fffdf8;--primary:#4f46e5;
 --primary-foreground:#fff;--accent:#e6e4ff;--accent-foreground:#3730a3;--muted:#ece9e1;
 --muted-foreground:#6b6e76;--success:#2f7d58;--error:#b94a48;--warning:#a66a1f;
 --border:#dcd8cf;--shadow:0 1px 3px rgba(35,37,45,.07);--shadow-md:0 6px 18px rgba(35,37,45,.08);
 --shadow-lg:0 16px 40px rgba(35,37,45,.1);--radius:12px;--radius-md:16px;--radius-lg:22px;
}
body.dark{
 --background:#17181d;--foreground:#f2f0ea;--surface:#22242b;--card:#1e2026;--primary:#8b84ff;
 --primary-foreground:#17181d;--accent:#302f52;--accent-foreground:#d8d5ff;--muted:#292b32;
 --muted-foreground:#a7a8af;--success:#63b487;--error:#e77d79;--warning:#d7a15b;--border:#383a43;
 --shadow:0 1px 3px rgba(0,0,0,.22);--shadow-md:0 6px 18px rgba(0,0,0,.28);--shadow-lg:0 16px 40px rgba(0,0,0,.35)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--background);color:var(--foreground);font-family:"IBM Plex Sans",sans-serif}
button,input,textarea,select{font:inherit}.hidden{display:none!important}
.shell{min-height:100vh;padding-bottom:94px}.main{width:min(720px,100%);margin:auto;padding:18px 18px 44px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
header>div{display:flex;align-items:center;gap:9px}.brandLogo{width:42px;height:42px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);font:700 23px/1 Newsreader;color:var(--primary)}
.headerRight{display:flex;align-items:center;gap:8px}.mini{font-size:11px;font-weight:600;color:var(--muted-foreground);background:var(--surface);padding:6px 9px;border-radius:99px}
.iconBtn{border:0;background:transparent;color:var(--foreground);width:34px;height:34px;border-radius:10px}.iconBtn:hover{background:var(--surface)}
.intro p{margin:0;color:var(--muted-foreground);font-size:13px}.intro h1,.pageTitle h1,.review h1{font-family:Newsreader,serif;font-size:36px;line-height:1.02;margin:6px 0 24px;letter-spacing:-.02em}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--card),var(--accent));border:1px solid var(--border);border-radius:22px;box-shadow:0 10px 30px rgba(55,48,163,.08);padding:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:12px}
.hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(79,70,229,.07);right:-55px;top:-62px}.hero>*{position:relative;z-index:1}
.heroLabel{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--accent-foreground)}.hero strong{display:block;font:700 62px/.9 Newsreader;margin-top:12px}.hero p{margin:7px 0 0;color:var(--muted-foreground);font-size:13px}
.btn{border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);border-radius:12px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;cursor:pointer}.btn.outline{background:transparent;color:var(--primary)}.btn:disabled{opacity:.5;cursor:not-allowed}
.streakCard{background:var(--card);border:1px solid var(--border);border-radius:20px;margin:18px 0 10px;box-shadow:var(--shadow);overflow:hidden}.streakOpen{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:18px}
.streakTop{display:flex;justify-content:space-between;align-items:flex-start}.streakLabel{font-size:10px;letter-spacing:.09em;font-weight:700;color:var(--warning)}.streakTop strong{display:block;font:700 46px/1 Newsreader;margin-top:8px}.streakTop strong small{font:600 13px "IBM Plex Sans";color:var(--muted-foreground)}
.streakStars{display:flex;align-items:center;gap:5px;color:var(--warning);font-weight:700;background:var(--surface);padding:7px 10px;border-radius:99px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}.week>div{display:grid;justify-items:center;gap:6px}.week span{font-size:10px;color:var(--muted-foreground);font-weight:600}
.day{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted-foreground)}.day.done{background:var(--accent);color:var(--warning)}.day.today{background:var(--primary);color:var(--primary-foreground)}
.streakHint{display:flex;justify-content:center;margin-top:14px;color:var(--primary);font-size:11px;font-weight:700}
.homeStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 28px}.homeStats div{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;gap:4px}.homeStats b{font:700 24px/1 Newsreader}.homeStats span{font-size:10px;color:var(--muted-foreground)}
.homeAction{background:var(--surface);border-radius:18px;padding:20px}.homeAction p{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.08em}.homeAction h2{font:600 23px/1.1 Newsreader;margin:0 0 18px}.homeAction .btn{width:100%}
.pageTitle{display:flex;align-items:center;justify-content:space-between;margin:10px 0 20px}.pageTitle h1{margin:4px 0}.eyebrow{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--muted-foreground);margin:0}
.addActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}.addActions .btn{width:100%}
.questionForm,.importBox{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:grid;gap:14px;margin-bottom:16px;box-shadow:var(--shadow)}.formHead{display:flex;justify-content:space-between}.formHead h2{font:600 23px Newsreader;margin:0}.formHead button{border:0;background:none;color:var(--muted-foreground);font-size:24px}
label{display:grid;gap:6px;font-size:11px;font-weight:700;color:var(--muted-foreground)}input,textarea,select{width:100%;border:1px solid var(--border);background:var(--background);color:var(--foreground);border-radius:10px;padding:10px 12px;outline:none}textarea{min-height:92px;resize:vertical}.twoFields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bankCount{font-size:11px;color:var(--muted-foreground);margin:20px 2px 9px}.cards{display:grid;gap:10px}.cards article{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.cardTop{display:flex;justify-content:space-between;align-items:center}.cardTop>div:first-child{display:flex;gap:8px}.cardTop span{font-size:11px;font-weight:700;color:var(--primary)}.cardTop small{color:var(--muted-foreground)}.cardTools{display:flex;gap:6px}.cardTools button{border:0;background:var(--surface);color:var(--muted-foreground);width:30px;height:30px;border-radius:9px}.cards h3{font-size:15px;margin:10px 0 6px}.cards p{margin:0;color:var(--muted-foreground);font-size:13px}.cards em{display:inline-block;margin-top:11px;font-size:9px;font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);background:var(--surface);padding:4px 7px;border-radius:99px}
.reportsPage{display:grid;gap:16px}.reportOverview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reportOverview>div{background:linear-gradient(145deg,var(--card),var(--surface));border:1px solid var(--border);border-radius:16px;padding:15px 12px}.reportOverview strong{display:block;font:700 27px/1 Newsreader}.reportOverview span{font-size:9px;color:var(--muted-foreground)}
.reportList{display:grid;gap:10px}.reportCard{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}.reportHead{width:100%;border:0;background:transparent;color:inherit;padding:16px;display:flex;justify-content:space-between;text-align:left}.reportDate{display:grid;gap:2px}.reportDate>span{font-size:8px;letter-spacing:.1em;font-weight:800;color:var(--primary)}.reportDate small{font-size:10px;color:var(--muted-foreground)}.reportScore{text-align:right}.reportScore strong{display:block;font:700 30px/1 Newsreader;color:var(--primary)}.reportScore span{font-size:10px;color:var(--muted-foreground)}
.reportDetails{border-top:1px solid var(--border);padding:14px;background:var(--surface);display:grid;gap:12px}.reportQuestion{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;display:grid;grid-template-columns:auto 1fr auto;gap:9px}.reportQuestion small{display:block;color:var(--muted-foreground)}
.settingsList{display:grid;gap:10px}.settingsList>button,.settingsList>div{width:100%;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:14px;padding:16px;display:flex;justify-content:space-between}.voiceDemo{margin-top:16px;background:linear-gradient(145deg,var(--card),var(--accent));border:1px solid var(--border);border-radius:18px;padding:18px;display:grid;gap:16px}.voiceDemo h2{font:600 24px Newsreader;margin:7px 0 5px}.voiceDemo p{font-size:11px;color:var(--muted-foreground);margin:0}
.streakPage{display:grid;gap:18px}.backButton{justify-self:start;border:0;background:none;color:var(--primary);font-weight:700}.streakPageHero{text-align:center;background:linear-gradient(145deg,var(--card),var(--accent));border:1px solid var(--border);border-radius:22px;padding:26px 18px}.streakPageHero h1{font:700 52px Newsreader;margin:8px 0 4px}.streakSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.streakSummary div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}.streakSummary strong{display:block;font:700 24px Newsreader}.streakSummary span{font-size:10px;color:var(--muted-foreground)}
.reviewPage{min-height:100vh;background:linear-gradient(180deg,var(--background),var(--surface));display:grid;place-items:start center;padding:16px 16px 34px}.quiz{width:min(620px,100%);display:grid;gap:18px}.quizTop{display:flex;align-items:center;gap:12px}.closeQuiz{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--muted-foreground);font-size:22px}.track{height:8px;background:var(--muted);border-radius:99px;flex:1;overflow:hidden}.track span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#8b84ff)}.quizTop small{font-size:11px;color:var(--muted-foreground)}
.quizMeta{display:flex;justify-content:space-between;gap:10px}.quizMeta span{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--primary);background:var(--accent);padding:6px 8px;border-radius:99px}.quizMeta b{font-size:11px;color:var(--muted-foreground)}
.questionPanel{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);padding:24px 20px;display:grid;gap:20px}.questionPanel h1{font:700 34px/1.08 Newsreader;margin:0}.questionKicker{margin:0;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted-foreground)}.answerArea{display:grid;gap:12px}.options{display:grid;gap:10px}.optionButton{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--foreground);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left}.optionButton span{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--primary)}
.flipCard{width:100%;height:300px;border:0;background:transparent;padding:0;perspective:1200px}.flipInner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.flipped .flipInner{transform:rotateY(180deg)}.flipFront,.flipBack{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow-md);padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.flipFront{background:var(--card);border:2px solid var(--primary);outline:5px solid var(--accent);outline-offset:3px}.flipBack{background:linear-gradient(145deg,var(--accent),var(--card));transform:rotateY(180deg)}.flipFront strong,.flipBack strong{font:700 31px/1.12 Newsreader}.flipFront span,.flipBack span{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted-foreground);margin-bottom:18px}.flipFront small,.flipBack small{position:absolute;bottom:20px;color:var(--muted-foreground)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feedback{border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.feedback.good{background:#e4f3e9;color:#246544}.feedback.bad{background:#f8e6e4;color:#923b39}.feedbackCopy{display:grid;gap:2px}.feedbackCopy span{font-size:11px}
.finish{width:min(480px,100%);margin:8vh auto 0;text-align:center;display:grid;gap:16px;justify-items:center;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:28px 22px;box-shadow:var(--shadow-lg)}.finishBadge{font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--primary);background:var(--accent);padding:7px 10px;border-radius:99px}.scoreRing{width:150px;height:150px;border-radius:50%;display:grid;place-content:center;background:conic-gradient(var(--primary) 0 75%,var(--muted) 75%)}.scoreRing strong{font:700 40px Newsreader}.scoreRing span{font-size:10px;color:var(--muted-foreground)}
.nav{position:fixed;bottom:0;left:0;right:0;height:74px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:20;padding-bottom:max(4px,env(safe-area-inset-bottom))}.nav button{width:min(20%,110px);border:0;background:none;color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600}.nav .active{color:var(--primary)}.nav .quizNav{color:var(--primary);transform:translateY(-7px)}.playCircle{width:44px;height:44px;border-radius:50%;background:var(--primary);color:white;display:grid;place-items:center;font-size:18px;box-shadow:0 5px 16px rgba(79,70,229,.3)}
.note{font-size:13px;color:var(--muted-foreground)}@media(min-width:760px){.main{padding-top:32px}.nav{left:50%;transform:translateX(-50%);width:520px;bottom:18px;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const starter=[
{id:"demo_short",subject:"Demo",topic:"Type Answer",prompt:"What is the capital of Japan?",answer:"Tokyo",type:"short_answer"},
{id:"demo_fill",subject:"Demo",topic:"Fill in the Blank",prompt:"World War II ended in _____.",answer:"1945",type:"fill_blank"},
{id:"demo_choice",subject:"Demo",topic:"Multiple Choice",prompt:"Which planet is the largest in our Solar System?",answer:"Jupiter",type:"single_choice",options:["Mars","Jupiter","Saturn","Earth"]},
{id:"demo_flash",subject:"Demo",topic:"Flashcard",prompt:"Which organelle is often called the powerhouse of the cell?",answer:"Mitochondrion",type:"flashcard"}];
const $=s=>document.querySelector(s), norm=s=>(s||"").toLowerCase().trim().replace(/[^a-z0-9]/g,""),today=()=>new Date().toISOString().slice(0,10);
let items=[],quizCount=0,streakDays=[],reports=[],tab="home",review=null,idx=0,answer="",revealed=false,result=null,started=Date.now(),results=[],message="",showAdd=false,showImport=false,editingId=null,dark=false,openReport=null;
function load(){try{items=JSON.parse(localStorage.getItem("recallflow_bank_v2")||"null")||starter;quizCount=+(localStorage.getItem("recallflow_quiz_count")||0);streakDays=JSON.parse(localStorage.getItem("recallflow_streak_days")||"[]");reports=JSON.parse(localStorage.getItem("recallflow_reports")||"[]");dark=localStorage.getItem("recallflow_theme")==="dark"}catch{items=starter}document.body.classList.toggle("dark",dark)}
function saveItems(){localStorage.setItem("recallflow_bank_v2",JSON.stringify(items))}
function startReview(){review=items.slice();idx=0;results=[];answer="";revealed=false;result=null;started=Date.now();render()}
function grade(forced){let c=review[idx],ok=typeof forced==="boolean"?forced:norm(answer)===norm(c.answer);result=ok;revealed=true;results.push({knowledge_id:c.id,subject:c.subject,topic:c.topic,type:c.type||"short_answer",prompt:c.prompt,correct_answer:c.answer,user_answer:c.type==="flashcard"?(ok?"self-marked: knew":"self-marked: did not know"):answer,correct:ok,response_time_seconds:Math.max(1,Math.round((Date.now()-started)/1000))});render()}
function next(){if(idx+1>=review.length){quizCount++;localStorage.setItem("recallflow_quiz_count",quizCount);if(!streakDays.includes(today()))streakDays.push(today());localStorage.setItem("recallflow_streak_days",JSON.stringify(streakDays));let correct=results.filter(x=>x.correct).length,r={id:"report_"+Date.now(),date:new Date().toISOString(),duration_seconds:results.reduce((a,b)=>a+b.response_time_seconds,0),total:results.length,correct,accuracy:results.length?Math.round(correct/results.length*100):0,questions:[...results]};reports.unshift(r);localStorage.setItem("recallflow_reports",JSON.stringify(reports));idx=review.length}else{idx++;answer="";revealed=false;result=null;started=Date.now()}render()}
function streak(){let n=0;for(let i=0;i<30;i++){let d=new Date();d.setDate(d.getDate()-i);if(streakDays.includes(d.toISOString().slice(0,10)))n++;else break}return n}
function days7(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let k=d.toISOString().slice(0,10);return{key:k,label:d.toLocaleDateString(undefined,{weekday:"narrow"}),done:streakDays.includes(k),today:k===today()}})}
function render(){if(review){renderReview();return}let content="";
if(tab==="home"){let ds=days7();content=`<section class="intro"><p>Good to see you.</p><h1>Ready for a quick quiz?</h1></section>
<section class="hero"><div><div class="heroLabel">✦ TODAY'S QUIZ</div><strong>${items.length}</strong><p>${items.length===1?"question":"questions"} in your quiz</p></div><button class="btn" onclick="startReview()">Take quiz →</button></section>
<section class="streakCard"><button class="streakOpen" onclick="tab='streak';render()"><div class="streakTop"><div><span class="streakLabel">🔥 CURRENT STREAK</span><strong>${streak()}<small> days</small></strong></div><div class="streakStars">★ ${streak()*10}</div></div><div class="week">${ds.map(d=>`<div><span>${d.label}</span><div class="day ${d.done?"done":d.today?"today":""}">${d.done?"★":d.today?"🔥":"×"}</div></div>`).join("")}</div><span class="streakHint">View streak details →</span></button></section>
<div class="homeStats"><div><span>✓</span><b>${quizCount}</b><span>Quizzes taken</span></div><div><span>▤</span><b>${items.length}</b><span>Questions</span></div></div>
<section class="homeAction"><p>Keep the habit going</p><h2>A few minutes a day is enough.</h2><button class="btn" onclick="startReview()">Take quiz →</button></section>`}
if(tab==="library"){content=`<section><div class="pageTitle"><div><p class="eyebrow">YOUR QUESTIONS</p><h1>Question bank</h1></div></div><div class="addActions"><button class="btn" onclick="openAdd()">＋ Add question</button><button class="btn outline" onclick="showImport=!showImport;render()">⇧ Import</button></div>${showAdd?formHtml():""}${showImport?importHtml():""}${message?`<p class="note">${message}</p>`:""}<div class="bankCount">${items.length} saved ${items.length===1?"question":"questions"}</div><div class="cards">${items.map(x=>`<article><div class="cardTop"><div><span>${x.subject}</span><small>${x.topic}</small></div><div class="cardTools"><button onclick="openAdd('${x.id}')">✎</button><button onclick="del('${x.id}')">🗑</button></div></div><h3>${x.prompt}</h3><p>${x.answer}</p><em>${(x.type||"short_answer").replaceAll("_"," ")}</em></article>`).join("")}</div></section>`}
if(tab==="results"){let avg=reports.length?Math.round(reports.reduce((a,r)=>a+r.accuracy,0)/reports.length):0,miss=reports.reduce((a,r)=>a+r.questions.filter(q=>!q.correct).length,0);content=`<section class="reportsPage"><div class="pageTitle"><div><p class="eyebrow">YOUR QUIZ RECORDS</p><h1>Reports</h1></div></div>${reports.length?`<div class="reportOverview"><div><strong>${reports.length}</strong><span>Quizzes</span></div><div><strong>${avg}%</strong><span>Avg. accuracy</span></div><div><strong>${miss}</strong><span>Total misses</span></div></div><div class="reportList">${reports.map((r,i)=>`<article class="reportCard"><button class="reportHead" onclick="openReport=openReport==='${r.id}'?null:'${r.id}';render()"><div class="reportDate"><span>${i===0?"LATEST":"QUIZ"}</span><strong>${new Date(r.date).toLocaleDateString()}</strong><small>${new Date(r.date).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</small></div><div class="reportScore"><strong>${r.accuracy}%</strong><span>${r.correct}/${r.total}</span></div></button>${openReport===r.id?`<div class="reportDetails">${r.questions.map(q=>`<div class="reportQuestion"><span>${q.correct?"✓":"✗"}</span><div><b>${q.prompt}</b><small>Your answer: ${q.user_answer||"No answer"}</small>${!q.correct?`<small>Correct: ${q.correct_answer}</small>`:""}</div><em>${q.response_time_seconds}s</em></div>`).join("")}<button class="btn outline" onclick='navigator.clipboard.writeText(JSON.stringify(${JSON.stringify(r)},null,2))'>Copy full report</button></div>`:""}</article>`).join("")}</div>`:`<div class="voiceDemo"><h2>No reports yet</h2><p>Finish your first quiz and its full report will appear here automatically.</p><button class="btn" onclick="startReview()">▶ Take a quiz</button></div>`}</section>`}
if(tab==="settings"){content=`<section><div class="pageTitle"><div><p class="eyebrow">RECALLFLOW</p><h1>Settings</h1></div></div><div class="settingsList"><button onclick="dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('recallflow_theme',dark?'dark':'light');render()"><span>◐ Theme</span><b>${dark?"Dark":"Light"}</b></button><div><span>▤ Stored questions</span><b>${items.length}</b></div></div><div class="voiceDemo"><div><span class="eyebrow">🔊 VOICE TEST</span><h2>Hear your device voice</h2><p>Uses the best English speech voice available on this device. Tap play to test sound.</p></div><button class="btn" onclick="speak()">🔊 Play sample</button></div></section>`}
if(tab==="streak"){content=`<section class="streakPage"><button class="backButton" onclick="tab='home';render()">← Home</button><div class="streakPageHero"><div style="font-size:34px">🔥</div><p class="eyebrow">YOUR STREAK</p><h1>${streak()} <small style="font:600 15px IBM Plex Sans;color:var(--muted-foreground)">day streak</small></h1><p>Complete a quiz each day to keep it going.</p></div><div class="streakSummary"><div><strong>${streak()}</strong><span>Current</span></div><div><strong>${streak()}</strong><span>Longest</span></div><div><strong>${streakDays.length}</strong><span>Active days</span></div></div></section>`}
app.innerHTML=`<div class="shell"><main class="main"><header><div><div class="brandLogo">R</div><strong>RecallFlow</strong></div><div class="headerRight"><span class="mini">${items.length} questions</span><button class="iconBtn" onclick="dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('recallflow_theme',dark?'dark':'light');render()">${dark?"☀":"☾"}</button></div></header>${content}</main>${nav()}</div>`}
function nav(){return `<nav class="nav"><button class="${tab==="home"?"active":""}" onclick="tab='home';render()">⌂<span>Home</span></button><button class="${tab==="library"?"active":""}" onclick="tab='library';render()">▤<span>Questions</span></button><button class="quizNav" onclick="startReview()"><span class="playCircle">▶</span><span>Quiz</span></button><button class="${tab==="results"?"active":""}" onclick="tab='results';render()">◷<span>Report</span></button><button class="${tab==="settings"?"active":""}" onclick="tab='settings';render()">⚙<span>Settings</span></button></nav>`}
function formHtml(){let x=editingId?items.find(i=>i.id===editingId):null;return `<div class="questionForm"><div class="formHead"><div><p class="eyebrow">${editingId?"EDIT":"NEW QUESTION"}</p><h2>${editingId?"Edit question":"Add manually"}</h2></div><button onclick="showAdd=false;render()">×</button></div><label>Question type<select id="f_type"><option value="short_answer" ${(x?.type||"short_answer")==="short_answer"?"selected":""}>Type answer</option><option value="fill_blank" ${x?.type==="fill_blank"?"selected":""}>Fill in the blank</option><option value="single_choice" ${x?.type==="single_choice"?"selected":""}>Multiple choice</option><option value="flashcard" ${x?.type==="flashcard"?"selected":""}>Flashcard</option></select></label><label>Question<textarea id="f_prompt">${x?.prompt||""}</textarea></label><label>Correct answer<input id="f_answer" value="${(x?.answer||"").replaceAll('"','&quot;')}"></label><label>Choices (one per line)<textarea id="f_options">${(x?.options||[]).join("\n")}</textarea></label><div class="twoFields"><label>Subject<input id="f_subject" value="${x?.subject||""}"></label><label>Topic<input id="f_topic" value="${x?.topic||""}"></label></div><button class="btn" onclick="saveQuestion()">Save</button></div>`}
function importHtml(){return `<div class="importBox"><p class="eyebrow">IMPORT MANY</p><h2 style="font-family:Newsreader;margin:0">Paste question JSON</h2><textarea id="imp">${importText}</textarea><button class="btn" onclick="doImport()">Import questions</button></div>`}
function openAdd(id=null){editingId=id;showAdd=true;render()}function saveQuestion(){let d={subject:$("#f_subject").value.trim()||"General",topic:$("#f_topic").value.trim()||"General",prompt:$("#f_prompt").value.trim(),answer:$("#f_answer").value.trim(),type:$("#f_type").value,options:$("#f_options").value.split("\n").map(x=>x.trim()).filter(Boolean)};if(!d.prompt||!d.answer)return;if(editingId)items=items.map(x=>x.id===editingId?{...x,...d}:x);else items.push({id:"item_"+Date.now(),...d});saveItems();showAdd=false;editingId=null;render()}function del(id){items=items.filter(x=>x.id!==id);saveItems();render()}
function doImport(){try{let p=JSON.parse($("#imp").value),a=Array.isArray(p)?p:(p.items||p.questions);if(!Array.isArray(a))throw 0;items.push(...a.map((x,i)=>({id:x.id||"item_"+Date.now()+"_"+i,subject:x.subject||"General",topic:x.topic||"Imported",prompt:x.prompt||x.question,answer:String(x.answer??""),type:x.type||"short_answer",options:x.options})));saveItems();showImport=false;render()}catch{message="That JSON could not be imported.";render()}}
function renderReview(){if(idx>=review.length){let c=results.filter(x=>x.correct).length,a=results.length?Math.round(c/results.length*100):0;app.innerHTML=`<main class="reviewPage"><section class="finish"><div class="finishBadge">✦ QUIZ COMPLETE</div><div class="scoreRing"><strong>${a}%</strong><span>accuracy</span></div><h1>Nice work.</h1><div class="two" style="width:100%"><div>${c} correct</div><div>${results.length-c} missed</div></div><button class="btn" onclick="navigator.clipboard.writeText(JSON.stringify({date:new Date().toISOString(),questions:results},null,2))">Copy full report</button><button class="btn outline" onclick="review=null;render()">Back home</button></section></main>`;return}let c=review[idx],body="";if(c.type==="flashcard"){body=`<button class="flipCard ${revealed?"flipped":""}" onclick="if(result===null){revealed=!revealed;render()}"><div class="flipInner"><div class="flipFront"><span>QUESTION</span><strong>${c.prompt}</strong><small>Tap to flip</small></div><div class="flipBack"><span>ANSWER</span><strong>${c.answer}</strong><small>Tap to see question</small></div></div></button>${revealed&&result===null?`<div class="two"><button class="btn outline" onclick="grade(false)">Didn't know</button><button class="btn" onclick="grade(true)">Knew it</button></div>`:""}`}else{body=`<div class="questionPanel"><p class="questionKicker">QUESTION ${idx+1}</p><h1>${c.prompt}</h1>${c.type==="single_choice"&&c.options?`<div class="options">${c.options.map((o,i)=>`<button class="optionButton" ${revealed?"disabled":""} onclick="answer='${o.replaceAll("'","\\'")}';grade(${norm(o)===norm(c.answer)})"><span>${String.fromCharCode(65+i)}</span><b>${o}</b></button>`).join("")}</div>`:`<div class="answerArea"><input id="ans" value="${answer}" placeholder="Type your answer…" ${revealed?"disabled":""} oninput="answer=this.value"><button class="btn" ${!answer||revealed?"disabled":""} onclick="grade()">Check answer</button></div>`}</div>`}app.innerHTML=`<main class="reviewPage"><section class="quiz"><div class="quizTop"><button class="closeQuiz" onclick="review=null;render()">×</button><div class="track"><span style="width:${((idx+1)/review.length)*100}%"></span></div><small>${idx+1} / ${review.length}</small></div><div class="quizMeta"><span>${(c.type||"short_answer").replaceAll("_"," ")}</span><b>${c.subject} · ${c.topic}</b></div>${body}${result!==null?`<div class="feedback ${result?"good":"bad"}"><div class="feedbackCopy"><strong>${result?"Correct!":"Not quite"}</strong>${!result?`<span>Correct answer: ${c.answer}</span>`:""}</div><button class="btn" onclick="next()">Continue →</button></div>`:""}</section></main>`}
function speak(){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("What is the capital of Japan? The correct answer is Tokyo.");speechSynthesis.speak(u)}catch{}}
load();render();
</script>
</body>
</html>
